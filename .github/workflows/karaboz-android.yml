name: Build Karaboz AI Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'karaboz-ai/android/**'
      - '.github/workflows/karaboz-android.yml'
    branches:
      - feature/karaboz-ai-backend
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: karaboz-ai/android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Karaboz-AI-debug-apk
          path: karaboz-ai/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
