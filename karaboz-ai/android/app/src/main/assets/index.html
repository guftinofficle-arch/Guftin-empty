<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1b"><title>Karaboz AI</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark;--line:rgba(160,180,220,.14);--muted:#91a0bd}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 72% -10%,rgba(89,70,180,.25),transparent 38%),radial-gradient(ellipse at 0 100%,rgba(22,130,155,.13),transparent 34%),#080d1b;color:#f6f5ff;font:15px system-ui;letter-spacing:.01em}
.layout{min-height:100vh}.side{display:none}.main{min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 17px;background:#0b1427;border-bottom:1px solid var(--line);font-weight:800;color:#d9d0ff}#status{float:right;font-size:11px;color:#7ee3ce;background:rgba(50,190,160,.09);border:1px solid rgba(80,220,185,.18);border-radius:30px;padding:6px 9px}
.wrap{width:min(900px,100%);margin:auto;flex:1;padding:18px 14px;display:flex;flex-direction:column;gap:18px}.hero{text-align:center;max-width:680px;margin:auto auto 20px}.orb,.logo{display:grid;place-items:center;background:linear-gradient(135deg,#9b7bff,#6b72ff 48%,#42d9e8);box-shadow:0 12px 42px rgba(113,89,255,.28)}.orb{width:82px;height:82px;border-radius:28px;font-size:38px;margin:0 auto 20px}h1{font-size:clamp(34px,9vw,46px);letter-spacing:-1.8px;margin:0}.gradient{background:linear-gradient(100deg,#c9b8ff,#7de7f0 85%);color:transparent;background-clip:text}.muted{color:var(--muted);line-height:1.75}.ideas{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:24px}.ideas button{background:linear-gradient(145deg,#1b2740,#101a2d);border:1px solid var(--line);border-radius:16px;padding:14px 12px;min-height:66px;color:#e4e9f7;text-align:left}
.messages{display:grid;gap:14px;padding:12px 0 20px}.msg{max-width:92%;padding:14px 16px;border-radius:18px;background:#17233a;border:1px solid var(--line);line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{margin-left:auto;background:linear-gradient(135deg,rgba(88,64,160,.75),rgba(47,57,112,.85));border-bottom-right-radius:6px}.msg:not(.user){border-bottom-left-radius:6px}
.compose{position:sticky;bottom:8px;display:flex;align-items:flex-end;gap:10px;padding:11px;background:rgba(17,28,48,.97);border:1px solid rgba(150,170,220,.22);border-radius:18px}.compose textarea{flex:1;min-width:0;background:none;color:white;border:0;outline:0;resize:vertical;padding:8px;font:inherit;min-height:42px}.btn{border:0;border-radius:14px;padding:13px;background:linear-gradient(120deg,#8b5cf6,#6366f1);color:white;font-weight:800}.compose .btn{width:46px;height:46px}
.auth{position:fixed;inset:0;background:rgba(5,9,18,.94);display:grid;place-items:center;padding:20px}.card{width:min(390px,100%);background:linear-gradient(150deg,#17223a,#0d1526);border:1px solid rgba(170,160,230,.2);border-radius:25px;padding:25px;box-shadow:0 25px 90px #0008}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;margin-bottom:14px}.logo{width:42px;height:42px;border-radius:15px}.field{width:100%;padding:15px;margin-top:10px;background:#080e1b;color:white;border:1px solid var(--line);border-radius:13px;font:inherit}.card .btn{width:100%;margin-top:14px}.switch{background:none;border:0;color:#c4b5fd;margin-top:12px;width:100%;padding:10px}
@media(min-width:700px){.layout{display:grid;grid-template-columns:250px 1fr}.side{display:block;background:#0c1323;padding:24px 18px;border-right:1px solid var(--line)}.side .btn{width:100%;text-align:left}.side p{font-size:10px;letter-spacing:1.8px;margin:28px 8px 10px}.main{min-height:100vh}.wrap{width:min(900px,100%);padding:28px}.ideas{gap:12px}.ideas button{padding:17px;min-height:70px}}
</style></head><body>
<div class="layout"><aside class="side"><div class="brand"><span class="logo">K</span>Karaboz AI</div><button class="btn" id="new">＋ New chat</button><p class="muted">RECENT CHATS</p><div id="history"></div></aside>
<main class="main"><header class="top">✦ Karaboz Assistant <span id="status">Connecting…</span></header><section class="wrap"><div class="hero" id="hero"><div class="orb">✧</div><h1>Meet <span class="gradient">Karaboz AI</span></h1><p class="muted">Explore ideas, learn and create. Ask in English, Urdu or Hindi.</p><div class="ideas"><button data-q="Explain a difficult topic simply.">✦ Explain something</button><button data-q="Help me plan a project.">◈ Plan a project</button><button data-q="Teach me a new skill.">⌘ Learn a skill</button><button data-q="Suggest ideas for a mobile app.">✧ Brainstorm</button></div></div><div class="messages" id="messages"></div><div class="compose"><textarea id="prompt" rows="2" placeholder="Message Karaboz AI…"></textarea><button class="btn" id="send">➤</button></div></section></main></div>
<div class="auth" id="auth"><div class="card"><div class="brand"><span class="logo">K</span>Karaboz AI</div><p class="muted">Sign in or create an account to save private chats.</p><input class="field" id="email" placeholder="Email" type="email" autocomplete="email"><input class="field" id="pass" placeholder="Password" type="password" autocomplete="current-password"><button class="btn" id="submit">Sign in</button><p id="err" class="muted"></p><button class="switch" id="toggle">New here? Create account</button></div></div>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const db=createClient("https://lttcoxzbjoevuaohpjir.supabase.co","sb_publishable_MjHWRO-tGhsPzz_y4PXbXg_cfjtfXSN"),$=x=>document.getElementById(x);let session=null,cid=null,signup=false,busy=false;
function bubble(role,t){let e=document.createElement("div");e.className="msg "+(role==="user"?"user":"");e.textContent=t;$("messages").append(e);e.scrollIntoView({block:"nearest",behavior:"smooth"})}
async function history(){let{data,error}=await db.from("karaboz_conversations").select("id,title").order("updated_at",{ascending:false}).limit(20);if(error)throw error;$("history").replaceChildren();(data||[]).forEach(c=>{let b=document.createElement("button");b.className="switch";b.textContent=c.title;b.onclick=async()=>{cid=c.id;$("messages").replaceChildren();$("hero").hidden=true;let{data,error}=await db.from("karaboz_messages").select("role,content").eq("conversation_id",cid).order("created_at");if(error)throw error;(data||[]).forEach(m=>bubble(m.role,m.content))};$("history").append(b)})}
async function start(){ $("auth").style.display="none";try{await history();let{data,error}=await db.functions.invoke("karaboz-chat",{method:"GET"});if(error)throw error;$("status").textContent=data?.inference_configured?"AI connected":"Backend online · AI setup pending"}catch(e){$("status").textContent="Connection issue";$("err").textContent=e.message}}
async function send(t){if(!session||busy||!t.trim())return;busy=true;$("hero").hidden=true;bubble("user",t);$("prompt").value="";$("send").disabled=true;try{let{data,error}=await db.functions.invoke("karaboz-chat",{body:{message:t,conversation_id:cid}});if(error)throw error;if(data.error)throw Error(data.error);cid=data.conversation_id;bubble("assistant",data.reply);await history()}catch(e){bubble("assistant","Unable to reply: "+e.message)}finally{busy=false;$("send").disabled=false}}
$("send").onclick=()=>send($("prompt").value);$("prompt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(e.target.value)}};$("new").onclick=()=>{cid=null;$("messages").replaceChildren();$("hero").hidden=false};document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>send(b.dataset.q));
$("toggle").onclick=()=>{signup=!signup;$("submit").textContent=signup?"Create account":"Sign in";$("toggle").textContent=signup?"Already registered? Sign in":"New here? Create account"};
$("submit").onclick=async()=>{try{$("err").textContent="";let r=signup?await db.auth.signUp({email:$("email").value,password:$("pass").value}):await db.auth.signInWithPassword({email:$("email").value,password:$("pass").value});if(r.error)throw r.error;if(signup&&!r.data.session){$("err").textContent="Confirm your email, then sign in.";return}session=r.data.session;await start()}catch(e){$("err").textContent=e.message}};
db.auth.onAuthStateChange((_e,s)=>{session=s;if(s)start();else $("auth").style.display="grid"});let{data:{session:s}}=await db.auth.getSession();session=s;if(s)await start();
</script></body></html>
