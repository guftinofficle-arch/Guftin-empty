<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karaboz AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f6f5ff;font:15px system-ui}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#111a2c;padding:22px;border-right:1px solid #29334b}.brand{font-size:21px;font-weight:800;margin-bottom:30px}.logo{display:inline-grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#22d3ee);width:38px;height:38px;border-radius:13px;margin-right:8px}.btn{border:0;border-radius:11px;padding:12px;background:linear-gradient(120deg,#8b5cf6,#6366f1);color:white;font-weight:700;cursor:pointer}.side .btn{width:100%;text-align:left}.main{display:flex;flex-direction:column;min-height:100vh}.top{padding:22px;border-bottom:1px solid #29334b;color:#c4b5fd}.wrap{width:min(800px,100%);margin:auto;flex:1;padding:24px;display:flex;flex-direction:column}.hero{text-align:center;margin:auto auto 28px}.orb{margin:auto auto 20px;width:72px;height:72px;border-radius:24px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,#8b5cf6,#22d3ee)}h1{font-size:38px;margin:0}.gradient{background:linear-gradient(90deg,#c4b5fd,#67e8f9);color:transparent;background-clip:text}.muted{color:#9aa8c0;line-height:1.6}.ideas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.ideas button{background:#172238;color:#dce4f5;border:1px solid #29334b;border-radius:12px;padding:14px;text-align:left;cursor:pointer}.messages{display:grid;gap:14px;padding:15px 0}.msg{padding:13px 16px;background:#172238;border:1px solid #29334b;border-radius:14px;white-space:pre-wrap;line-height:1.6;max-width:85%}.user{margin-left:auto;background:#282044}.compose{display:flex;gap:10px;padding:10px;background:#121d30;border:1px solid #394761;border-radius:16px}.compose textarea{flex:1;background:none;color:white;border:0;outline:0;resize:vertical;padding:8px}.auth{position:fixed;inset:0;background:#070b14ee;display:grid;place-items:center;padding:20px}.card{width:min(390px,100%);background:#141e31;border:1px solid #29334b;border-radius:20px;padding:25px}.field{width:100%;padding:13px;margin-top:10px;background:#0b1020;color:white;border:1px solid #29334b;border-radius:10px}.card .btn{width:100%;margin-top:14px}.switch{background:none;border:0;color:#c4b5fd;margin-top:12px;width:100%}@media(max-width:650px){.layout{grid-template-columns:1fr}.side{display:none}.wrap{padding:14px}.ideas{grid-template-columns:1fr}h1{font-size:30px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><span class="logo">K</span>Karaboz AI</div><button class="btn" id="new">＋ New chat</button><p class="muted">RECENT CHATS</p><div id="history"></div></aside><main class="main"><header class="top">✦ Karaboz Assistant <span id="status" style="float:right;font-size:12px">Checking…</span></header><section class="wrap"><div class="hero" id="hero"><div class="orb">✧</div><h1>Meet <span class="gradient">Karaboz AI</span></h1><p class="muted">Explore ideas, learn and create. Ask in English, Urdu or Hindi.</p><div class="ideas"><button data-q="Explain a difficult topic simply.">✦ Explain something</button><button data-q="Help me plan a project.">◈ Plan a project</button><button data-q="Teach me a new skill.">⌘ Learn a skill</button><button data-q="Suggest ideas for a mobile app.">✧ Brainstorm</button></div></div><div class="messages" id="messages"></div><div class="compose"><textarea id="prompt" rows="2" placeholder="Message Karaboz AI…"></textarea><button class="btn" id="send">➤</button></div></section></main></div><div class="auth" id="auth"><div class="card"><div class="brand"><span class="logo">K</span>Karaboz AI</div><p class="muted">Sign in or create an account to save private chats.</p><input class="field" id="email" placeholder="Email" type="email"><input class="field" id="pass" placeholder="Password (8+ characters)" type="password"><button class="btn" id="submit">Sign in</button><p id="err" class="muted"></p><button class="switch" id="toggle">New here? Create account</button></div></div><script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const db=createClient("https://lttcoxzbjoevuaohpjir.supabase.co","sb_publishable_MjHWRO-tGhsPzz_y4PXbXg_cfjtfXSN"),$=x=>document.getElementById(x);let session=null,cid=null,signup=false,busy=false;
function bubble(role,t){let e=document.createElement("div");e.className="msg "+(role==="user"?"user":"");e.textContent=t;$("messages").append(e)}
async function history(){let{data}=await db.from("karaboz_conversations").select("id,title").order("updated_at",{ascending:false}).limit(20);$("history").replaceChildren();(data||[]).forEach(c=>{let b=document.createElement("button");b.className="switch";b.textContent=c.title;b.onclick=async()=>{cid=c.id;$("messages").replaceChildren();$("hero").hidden=true;let{data}=await db.from("karaboz_messages").select("role,content").eq("conversation_id",cid).order("created_at");(data||[]).forEach(m=>bubble(m.role,m.content))};$("history").append(b)})}
async function start(){ $("auth").style.display="none";await history();let{data}=await db.functions.invoke("karaboz-chat",{method:"GET"});$("status").textContent=data?.inference_configured?"AI connected":"Backend online · AI setup pending"}
async function send(t){if(!session||busy||!t.trim())return;busy=true;$("hero").hidden=true;bubble("user",t);$("prompt").value="";try{let{data,error}=await db.functions.invoke("karaboz-chat",{body:{message:t,conversation_id:cid}});if(error)throw error;if(data.error)throw Error(data.error);cid=data.conversation_id;bubble("assistant",data.reply);await history()}catch(e){bubble("assistant","Unable to reply: "+e.message+". AI provider setup may be needed.")}finally{busy=false}}
$("send").onclick=()=>send($("prompt").value);$("prompt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(e.target.value)}};$("new").onclick=()=>{cid=null;$("messages").replaceChildren();$("hero").hidden=false};document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>send(b.dataset.q));
$("toggle").onclick=()=>{signup=!signup;$("submit").textContent=signup?"Create account":"Sign in";$("toggle").textContent=signup?"Already registered? Sign in":"New here? Create account"};
$("submit").onclick=async()=>{try{let r=signup?await db.auth.signUp({email:$("email").value,password:$("pass").value}):await db.auth.signInWithPassword({email:$("email").value,password:$("pass").value});if(r.error)throw r.error;if(signup&&!r.data.session){$("err").textContent="Confirm your email, then sign in.";return}session=r.data.session;await start()}catch(e){$("err").textContent=e.message}};
db.auth.onAuthStateChange((_e,s)=>{session=s;if(s)start();else $("auth").style.display="grid"});let{data:{session:s}}=await db.auth.getSession();session=s;if(s)await start();
</script></body></html>
